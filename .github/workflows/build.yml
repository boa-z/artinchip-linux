name: QEMU RISC-V M0

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, linux-7.3.5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: ./scripts/host-deps.sh --install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/dl
          key: buildroot-downloads-${{ runner.os }}-${{ hashFiles('sources.lock.json', 'configs/*', 'board/qemu/patches/**/*.hash') }}
          restore-keys: buildroot-downloads-${{ runner.os }}-
      - name: Configure and build
        run: ./scripts/build.sh build ${{ matrix.profile }}
      - name: Boot and smoke test
        run: ./scripts/build.sh test ${{ matrix.profile }}
      - name: Collect traceable artifacts
        run: ./scripts/build.sh artifacts ${{ matrix.profile }}
      - name: Preserve build and boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qemu-${{ matrix.profile }}-${{ github.sha }}
          path: |
            artifacts/${{ matrix.profile }}/
            output/${{ matrix.profile }}/build.log
            output/${{ matrix.profile }}/smoke.log
            output/${{ matrix.profile }}/smoke-result.json
          if-no-files-found: warn
          retention-days: 14
